services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-3309}:3306"
    environment:
      TZ: ${TZ}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysqld.cnf:/etc/mysql/conf.d/taller.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  admin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8051}:80"
    environment:
      PMA_HOST: database
    depends_on:
      - database

  public:
    build: ./
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8050}:80"
    env_file: .env
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./:/var/www/html
      - ./xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
    depends_on:
      database:
        condition: service_healthy

  # Tareas periódicas (recordatorios automáticos de turnos).
  tareas:
    build: ./
    restart: unless-stopped
    user: www-data
    env_file: .env
    environment:
      SKIP_SETUP: "1"
      XDEBUG_MODE: "off"
    volumes:
      - ./:/var/www/html
    depends_on:
      - public
    command: >
      sh -c 'until [ -f vendor/autoload.php ]; do sleep 5; done;
             while true; do php bin/tareas.php; sleep 900; done'

volumes:
  db_data:
